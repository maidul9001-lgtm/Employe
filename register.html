<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 20px 60px rgba(15,23,42,.14)}h1{text-align:center;margin:0}.sub{text-align:center;color:#64748b;margin:8px 0 24px}
label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d8dee9;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
a{color:#4338ca;font-weight:700;text-decoration:none}.links{text-align:center;margin-top:16px;color:#64748b}.msg{display:none;margin:14px 0;padding:12px;border-radius:10px}.msg.show{display:block}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
</style></head><body><section class="card"><h1>📝 রেজিস্ট্রেশন</h1><div class="sub">নতুন অ্যাকাউন্ট ডিফল্টভাবে Public হবে</div><div id="msg" class="msg"></div>
<form id="form"><label>নাম</label><input id="name" required><label>ইউজারনেম</label><input id="username" required><label>ইমেইল</label><input id="email" type="email" required><label>পাসওয়ার্ড</label><input id="password" type="password" minlength="6" required><button id="submit" type="submit">রেজিস্ট্রেশন</button></form>
<div class="links">আগে অ্যাকাউন্ট আছে? <a href="login.html">লগইন</a></div></section><script>const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("form"),msg=document.getElementById("msg"),btn=document.getElementById("submit");
function show(t,c="error"){msg.textContent=t;msg.className="msg show "+c}
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;try{const uname=username.value.trim();const q=await client.rpc("get_login_email",{p_username:uname});if(q.error)throw q.error;if(q.data){show("এই ইউজারনেম আগে থেকেই আছে।");return}const r=await client.auth.signUp({email:email.value.trim().toLowerCase(),password:password.value,options:{data:{full_name:name.value.trim(),username:uname}}});if(r.error)throw r.error;show(r.data.session?"রেজিস্ট্রেশন সফল। Dashboard-এ যাচ্ছেন।":"রেজিস্ট্রেশন সফল। Email verification প্রয়োজন হলে email verify করুন।","ok");if(r.data.session)setTimeout(()=>location.href="dashboard.html",800);else form.reset()}catch(e){show(e.message||"রেজিস্ট্রেশন ব্যর্থ হয়েছে।")}finally{btn.disabled=false}});</script></body></html>
