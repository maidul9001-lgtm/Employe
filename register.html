<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f5f7fb;margin:0}.box{max-width:420px;margin:6vh auto;background:white;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0002}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:11px}button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:700}a{color:#2563eb}.msg{margin:10px 0;color:#166534}</style></head><body><div class="box"><h2>📝 রেজিস্ট্রেশন</h2><p>নতুন অ্যাকাউন্ট ডিফল্টভাবে Public হবে।</p><div id="msg" class="msg"></div><form id="f"><label>নাম</label><input id="n" required><label>ইউজারনেম</label><input id="u" required><label>ইমেইল</label><input id="e" type="email" required><label>পাসওয়ার্ড</label><input id="p" type="password" minlength="6" required><button>রেজিস্ট্রেশন</button></form><p>আগে অ্যাকাউন্ট আছে? <a href="login.html">লগইন</a></p></div><script>f.onsubmit=async x=>{x.preventDefault();let q=await sb.rpc('get_login_email',{p_username:u.value.trim()});if(q.data){msg.textContent='এই ইউজারনেম আগে থেকেই আছে।';return}let r=await sb.auth.signUp({email:e.value.trim().toLowerCase(),password:p.value,options:{data:{full_name:n.value.trim(),username:u.value.trim()}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent='রেজিস্ট্রেশন সফল। Email verification প্রয়োজন হলে email verify করুন।';f.reset()};</script></body></html>
