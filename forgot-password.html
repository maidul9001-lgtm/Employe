<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f5f7fb;margin:0}.box{max-width:420px;margin:10vh auto;background:white;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0002}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:11px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:700}.msg{margin:12px 0}</style></head><body><div class="box"><h2>🔑 পাসওয়ার্ড ভুলে গেছেন?</h2><div id="msg" class="msg"></div><form id="f"><label>আপনার ইমেইল</label><input id="e" type="email" required><button>Reset Link পাঠান</button></form><p><a href="login.html">← Login</a></p></div><script>f.onsubmit=async x=>{x.preventDefault();let r=await sb.auth.resetPasswordForEmail(e.value.trim(),{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});msg.textContent=r.error?r.error.message:'Password reset link আপনার email-এ পাঠানো হয়েছে।';}</script></body></html>
