<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f5f7fb;margin:0}.box{max-width:420px;margin:10vh auto;background:white;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0002}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:11px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:700}.msg{margin:12px 0}</style></head><body><div class="box"><h2>🔐 নতুন পাসওয়ার্ড</h2><div id="msg" class="msg"></div><form id="f"><label>নতুন পাসওয়ার্ড</label><input id="p" type="password" minlength="6" required><label>আবার লিখুন</label><input id="c" type="password" minlength="6" required><button>পাসওয়ার্ড পরিবর্তন</button></form></div><script>f.onsubmit=async x=>{x.preventDefault();if(p.value!==c.value){msg.textContent='দুইটি password একই নয়।';return}let r=await sb.auth.updateUser({password:p.value});msg.textContent=r.error?r.error.message:'Password পরিবর্তন হয়েছে।';if(!r.error)setTimeout(()=>location.href='login.html',1200)}</script></body></html>
