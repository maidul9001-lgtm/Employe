<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f5f7fb;margin:0}.box{max-width:420px;margin:10vh auto;background:white;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0002}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:11px}button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:700}a{color:#2563eb}.msg{margin:10px 0;color:#b91c1c}</style></head><body><div class="box"><h2>🔐 লগইন</h2><p>ইউজারনেম অথবা ইমেইল দিয়ে লগইন করুন।</p><div id="msg" class="msg"></div><form id="f"><label>ইউজারনেম / ইমেইল</label><input id="u" required><label>পাসওয়ার্ড</label><input id="p" type="password" required><button>লগইন</button></form><p><a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a></p><p>অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন</a></p></div><script>f.onsubmit=async e=>{e.preventDefault();let email=u.value.trim();if(!email.includes('@')){let q=await sb.rpc('get_login_email',{p_username:email});if(q.error||!q.data){msg.textContent='ইউজারনেম/পাসওয়ার্ড সঠিক নয়।';return}email=q.data}let r=await sb.auth.signInWithPassword({email,password:p.value});if(r.error){msg.textContent='ইউজারনেম/পাসওয়ার্ড সঠিক নয়।';return}location.href='dashboard.html'};</script></body></html>
