<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 20px 60px rgba(15,23,42,.14)}h1{text-align:center;margin:0}.sub{text-align:center;color:#64748b;margin:8px 0 24px}
label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d8dee9;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
a{color:#4338ca;font-weight:700;text-decoration:none}.links{text-align:center;margin-top:16px;color:#64748b}.msg{display:none;margin:14px 0;padding:12px;border-radius:10px}.msg.show{display:block}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
</style></head><body><section class="card"><h1>🔐 লগইন</h1><div class="sub">Employee Management</div><div id="msg" class="msg"></div>
<form id="form"><label>ইউজারনেম / ইমেইল</label><input id="username" required autocomplete="username"><label>পাসওয়ার্ড</label><input id="password" type="password" required autocomplete="current-password"><button id="submit" type="submit">লগইন</button></form>
<div class="links"><a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a></div><div class="links">অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন</a></div></section><script>const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("form"),msg=document.getElementById("msg"),btn=document.getElementById("submit");
function show(t,c="error"){msg.textContent=t;msg.className="msg show "+c}
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;try{let value=username.value.trim(),email=value;if(!value.includes("@")){const q=await client.rpc("get_login_email",{p_username:value});if(q.error||!q.data)throw new Error("bad");email=q.data}const r=await client.auth.signInWithPassword({email,password:password.value});if(r.error)throw r.error;location.href="dashboard.html"}catch(e){show("ইউজারনেম/পাসওয়ার্ড সঠিক নয়।")}finally{btn.disabled=false}});</script></body></html>
